<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DueMate — Reset your password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --navy:#0F2C4C; --coral:#FF6B4A;
            --bg:#F5F6F8; --surface:#fff; --border:#E7EBF0; --muted:#6B7C92;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--navy);
            min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px;
        }
        .langs{display:flex;gap:4px;margin-bottom:20px;align-self:center}
        .langs button{
            border:0;background:none;font-family:inherit;font-size:13px;font-weight:600;
            color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:999px;
        }
        .langs button[aria-current="true"]{background:var(--surface);color:var(--navy);border:1px solid var(--border)}
        .card{
            background:var(--surface);border:1px solid var(--border);border-radius:20px;
            padding:32px 28px;max-width:400px;width:100%;margin:auto 0;
        }
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
        .logo-mark{width:32px;height:32px;border-radius:9px;background:var(--navy);position:relative;flex-shrink:0}
        .logo-mark::before,.logo-mark::after{
            content:"";position:absolute;width:13px;height:13px;border-radius:50%;
            border:2px solid #fff;top:9px;
        }
        .logo-mark::before{left:5px}
        .logo-mark::after{right:5px;border-color:#9FB8D4}
        .logo-text{font-weight:800;font-size:18px}
        h1{font-size:20px;font-weight:800;margin-bottom:6px;text-align:center}
        p.sub{font-size:13.5px;color:var(--muted);margin-bottom:22px;line-height:1.5;text-align:center}
        label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
        input{
            width:100%;font-family:inherit;font-size:15px;padding:13px 14px;
            border:1.5px solid var(--border);border-radius:12px;margin-bottom:14px;background:var(--bg);
        }
        input:focus{outline:none;border-color:var(--navy)}
        button[type=submit]{
            width:100%;font-family:inherit;font-size:15px;font-weight:800;color:var(--navy);
            background:var(--coral);border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:6px;
        }
        button[type=submit]:disabled{opacity:.6;cursor:default}
        .msg{margin-top:14px;font-size:13.5px;text-align:center;min-height:18px}
        .msg.err{color:#8A2A22}
        .msg.ok{color:#0F6B4A}
        .hint{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
        @media(prefers-color-scheme:dark){
            :root{--bg:#0B1420;--surface:#16212F;--border:#29394D;--navy:#F2F5F8;--muted:#93A6BD}
        }
    </style>
</head>
<body>
<nav class="langs">
    <button data-lang="fr">FR</button>
    <button data-lang="nl">NL</button>
    <button data-lang="en">EN</button>
</nav>

<div class="card">
    <div class="logo">
        <img class="logo-mark" src="assets/logo.svg" alt="" width="32" height="32">
        <span class="logo-text">DueMate</span>
    </div>
    <h1 data-i="title"></h1>
    <p class="sub" id="subtitle"></p>

    <form id="f">
        <label for="pwd" data-i="pwdLabel"></label>
        <input type="password" id="pwd" required minlength="6" autocomplete="new-password">
        <p class="hint" data-i="hint"></p>
        <label for="pwd2" data-i="pwd2Label"></label>
        <input type="password" id="pwd2" required minlength="6" autocomplete="new-password">
        <button type="submit" id="btn" data-i="submit"></button>
    </form>
    <p class="msg" id="msg"></p>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://fnxiygzcoffxwkqavedk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_48tbD4716jqFXwAdEX3rBA__2XENbBp';

    const T = {
        fr: {
            title: "Nouveau mot de passe",
            subtitleDefault: "Choisissez un nouveau mot de passe pour votre compte.",
            subtitleVerified: "Lien vérifié. Choisissez votre nouveau mot de passe.",
            subtitleWrongDevice: "Ce lien ne fonctionne que sur l'appareil qui a fait la demande. Ouvrez l'email depuis votre téléphone.",
            subtitleExpired: "Ce lien a expiré ou a déjà été utilisé.",
            subtitleInvalid: "Lien invalide — redemandez un email depuis l'app.",
            pwdLabel: "Mot de passe",
            hint: "Minimum 6 caractères.",
            pwd2Label: "Confirmez le mot de passe",
            submit: "Réinitialiser",
            errNotReady: "Le lien n'est pas valide. Redemandez un email.",
            errMismatch: "Les deux mots de passe ne correspondent pas.",
            errGeneric: "Une erreur est survenue :",
            success: "Mot de passe changé — vous pouvez fermer cette page et vous reconnecter dans l'app.",
        },
        nl: {
            title: "Nieuw wachtwoord",
            subtitleDefault: "Kies een nieuw wachtwoord voor je account.",
            subtitleVerified: "Link geverifieerd. Kies je nieuwe wachtwoord.",
            subtitleExpired: "Deze link is verlopen of al gebruikt.",
            subtitleInvalid: "Ongeldige link — vraag een nieuwe e-mail aan via de app.",
            pwdLabel: "Wachtwoord",
            hint: "Minimaal 6 tekens.",
            pwd2Label: "Bevestig wachtwoord",
            submit: "Opnieuw instellen",
            errNotReady: "De link is niet geldig. Vraag een nieuwe e-mail aan.",
            errMismatch: "De wachtwoorden komen niet overeen.",
            errGeneric: "Er is iets misgegaan:",
            success: "Wachtwoord gewijzigd — je kan dit venster sluiten en opnieuw inloggen in de app.",
        },
        en: {
            title: "New password",
            subtitleDefault: "Choose a new password for your account.",
            subtitleVerified: "Link verified. Choose your new password.",
            subtitleExpired: "This link has expired or was already used.",
            subtitleInvalid: "Invalid link — request a new email from the app.",
            pwdLabel: "Password",
            hint: "Minimum 6 characters.",
            pwd2Label: "Confirm password",
            submit: "Reset password",
            errNotReady: "This link isn't valid. Request a new email.",
            errMismatch: "The two passwords don't match.",
            errGeneric: "Something went wrong:",
            success: "Password changed — you can close this page and sign in again from the app.",
        },
    };

    let lang = (navigator.language || 'en').slice(0, 2);
    if (!T[lang]) lang = 'en';

    function render() {
        const t = T[lang];
        document.documentElement.lang = lang;
        document.getElementById('title') || null;
        document.querySelector('[data-i="title"]').textContent = t.title;
        document.getElementById('subtitle').textContent = subtitleState === 'verified' ? t.subtitleVerified
            : subtitleState === 'expired' ? t.subtitleExpired
                : subtitleState === 'invalid' ? t.subtitleInvalid
                    : t.subtitleDefault;
        document.querySelector('[data-i="pwdLabel"]').textContent = t.pwdLabel;
        document.querySelector('[data-i="hint"]').textContent = t.hint;
        document.querySelector('[data-i="pwd2Label"]').textContent = t.pwd2Label;
        document.querySelector('[data-i="submit"]').textContent = t.submit;
        document.querySelectorAll('.langs button').forEach(b =>
            b.setAttribute('aria-current', b.dataset.lang === lang));
    }

    document.querySelectorAll('.langs button').forEach(b =>
        b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    let ready = false;
    let subtitleState = 'default';

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (code) {
            const { error } = await supabase.auth.exchangeCodeForSession(code);
            if (error) {
                subtitleState = 'expired';
                render();
                return;
            }
            ready = true;
            subtitleState = 'verified';
            render();
            window.history.replaceState({}, '', window.location.pathname);
        } else {
            subtitleState = 'invalid';
            render();
        }
    }

    render();
    init();

    document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const t = T[lang];

        if (!ready) {
            msg.textContent = t.errNotReady;
            msg.className = 'msg err';
            return;
        }

        const pwd = document.getElementById('pwd').value;
        const pwd2 = document.getElementById('pwd2').value;

        msg.textContent = '';
        msg.className = 'msg';

        if (pwd !== pwd2) {
            msg.textContent = t.errMismatch;
            msg.className = 'msg err';
            return;
        }

        btn.disabled = true;
        const { error } = await supabase.auth.updateUser({ password: pwd });
        btn.disabled = false;

        if (error) {
            msg.textContent = t.errGeneric + ' ' + error.message;
            msg.className = 'msg err';
        } else {
            msg.textContent = t.success;
            msg.className = 'msg ok';
            document.getElementById('f').style.display = 'none';
        }
    });
</script>
</body>
</html>
