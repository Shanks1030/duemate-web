<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DueMate — Account confirmed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --navy:#0F2C4C; --coral:#FF6B4A;
            --bg:#F5F6F8; --surface:#fff; --border:#E7EBF0; --muted:#6B7C92;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--navy);
            min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
        }
        .card{
            background:var(--surface);border:1px solid var(--border);border-radius:20px;
            padding:36px 28px;max-width:380px;width:100%;text-align:center;
        }
        .check{
            width:56px;height:56px;border-radius:50%;background:#E8F6F0;
            display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
        }
        .check svg{width:26px;height:26px}
        h1{font-size:20px;font-weight:800;margin-bottom:8px}
        p{font-size:14px;color:var(--muted);line-height:1.5}
        @media(prefers-color-scheme:dark){
            :root{--bg:#0B1420;--surface:#16212F;--border:#29394D;--navy:#F2F5F8;--muted:#93A6BD}
        }
    </style>
</head>
<body>
<div class="card">
    <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0F6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>
    <h1>Account confirmed</h1>
    <p>Your email address is verified. You can close this page and sign in from the DueMate app.</p>
</div>
</body>
</html>
